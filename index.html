<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CryptoDesk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 80px 24px;
    }

    h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #444;
    }

    .tagline {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 32px;
    }

    .cta {
      display: inline-block;
      margin-top: 40px;
      padding: 14px 28px;
      background: #000;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
    }

    .cta:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="tagline">Institutional Trading Desk</div>

    <h1>CryptoDesk</h1>

    <p>
      We don’t trade indicators.<br>
      We trade liquidity, structure, and execution.
    </p>

    <a class="cta" href="https://t.me/CryptoDeskSupportoffical_bot">
      Join CryptoDesk
    </a>
  </div>
</body>
</html>
