<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoDesk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, #f2f2f2 45%, #e9e9e9 100%);
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 100px 24px;
    }

    .tagline {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9a9a9a;
      margin-bottom: 28px;
      font-weight: 600;
    }

    h1 {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.7;
      color: #555;
      max-width: 600px;
    }

    .cta {
      display: inline-block;
      margin-top: 48px;
      padding: 16px 36px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }

    .cta:hover {
      background: rgba(0,0,0,0.9);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="tagline">Institutional Trading Desk</div>

    <h1>CryptoDesk</h1>

    <p>
      We don’t trade indicators.<br>
      We trade liquidity, structure, and execution.
    </p>

    <a class="cta" href="https://t.me/CryptoDeskSupportoffical_bot">
      Join CryptoDesk
    </a>
  </div>
</body>
</html>
